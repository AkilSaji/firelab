<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deep Quest · FireLab depth benchmark</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #12101c; color: #eef1fa; font: 18px/1.4 system-ui, sans-serif; overflow: hidden; }
      #app { display: grid; grid-template-columns: 1fr 200px; gap: 24px; padding: 32px 40px; height: calc(100% - 64px); box-sizing: border-box; }
      #crumbs { color: #8c93ad; font-size: 13px; margin-bottom: 10px; }
      #panel { background: #1d1a2d; border: 1px solid #2f2a47; border-radius: 14px; padding: 22px 26px; }
      #panel.dialog { border-color: #ff8a3d; box-shadow: 0 0 0 3px rgba(255, 138, 61, 0.15); }
      h1 { margin: 0 0 6px; font-size: 28px; }
      #text { color: #b9c0d8; min-height: 1.4em; margin: 0 0 18px; }
      #buttons { display: flex; gap: 10px; }
      #buttons.col { flex-direction: column; align-items: flex-start; }
      button { font: inherit; color: inherit; background: #2a2540; border: 2px solid transparent; border-radius: 10px; padding: 8px 18px; outline: none; }
      button.focused { border-color: #ff8a3d; background: #3a2c35; }
      canvas { width: 200px; height: 260px; border-radius: 12px; background: #0b0a12; }
    </style>
  </head>
  <body>
    <div id="app">
      <div>
        <div id="crumbs"></div>
        <div id="panel">
          <h1 id="title"></h1>
          <p id="text"></p>
          <div id="buttons"></div>
        </div>
      </div>
      <canvas id="torch" width="200" height="260"></canvas>
    </div>
    <script type="module" src="game.js"></script>
  </body>
</html>
